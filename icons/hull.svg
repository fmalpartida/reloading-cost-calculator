<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <defs>
    <linearGradient id="hullG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#7a1414"/>
      <stop offset="45%"  stop-color="#d23a3a"/>
      <stop offset="100%" stop-color="#7a1414"/>
    </linearGradient>
    <linearGradient id="hullBaseG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#8a6200"/>
      <stop offset="50%"  stop-color="#f5d060"/>
      <stop offset="100%" stop-color="#8a6200"/>
    </linearGradient>
  </defs>
  <!-- plastic tube -->
  <rect x="8" y="3" width="8" height="13" rx="0.8" fill="url(#hullG)"/>
  <!-- star crimp -->
  <path d="M8.4,3.4 L12,5.2 L15.6,3.4" fill="none" stroke="#5a0e0e" stroke-width="0.7" stroke-linecap="round"/>
  <!-- brass head -->
  <rect x="8" y="15" width="8" height="5" rx="0.6" fill="url(#hullBaseG)"/>
  <!-- rim -->
  <rect x="7.2" y="19.3" width="9.6" height="1.7" rx="0.6" fill="#6a4800"/>
</svg>
