<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <defs>
    <linearGradient id="slugG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#4a5159"/>
      <stop offset="45%"  stop-color="#c9d0d7"/>
      <stop offset="100%" stop-color="#4a5159"/>
    </linearGradient>
  </defs>
  <!-- rounded nose and body of a Foster-style slug -->
  <path d="M7,20 L7,10 Q7,4 12,4 Q17,4 17,10 L17,20 Z" fill="url(#slugG)"/>
  <!-- rifling ribs -->
  <path d="M9,11 L9,19 M12,10 L12,19 M15,11 L15,19" stroke="#5b636b" stroke-width="0.8" opacity="0.7"/>
  <!-- hollow base -->
  <ellipse cx="12" cy="20" rx="5" ry="1.2" fill="#3a4047"/>
</svg>
